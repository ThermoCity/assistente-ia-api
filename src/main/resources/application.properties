spring.application.name=assistente-ia-api
server.port=${PORT:8081}

# ---------- Banco de dados (Oracle, tabelas TMC_) ----------
# O esquema vem do repositorio thermocity-banco-de-dados; a API so confere (validate).

# ---------- Modelo de IA (Google Gemini) ----------
# Configurado exclusivamente para Google Gemini (Google AI Studio).
# Nunca coloque a chave aqui: use a variavel de ambiente GEMINI_API_KEY.
spring.ai.openai.api-key=${GEMINI_API_KEY:not-set}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.model=gemini-2.5-flash

# Embeddings (RAG) pela API nativa do Gemini, com a mesma chave.
# O endpoint compativel com OpenAI devolve os embeddings sem o campo "index" e o cliente da OpenAI falha.
spring.ai.model.embedding=none
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:not-set}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001

# ---------- Outras APIs do ThermoCity ----------
# API Java da base territorial (pessoas e refugios)
thermocity.base-territorial.url=${BASE_TERRITORIAL_URL:http://localhost:8080}
# API .NET do clima (nivel de calor do dia). Vazio = usa o nivel de demonstracao abaixo.
thermocity.clima.url=${CLIMA_API_URL:}
thermocity.clima.nivel-demonstracao=3
thermocity.clima.ic-demonstracao=36.2

# ---------- RAG ----------
# Quantos trechos dos guias oficiais entram em cada pedido
thermocity.rag.trechos=4
